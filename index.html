<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Report — রংপুর সরকারি কলেজ</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI','Noto Sans Bengali',Arial,sans-serif;margin:0;min-height:100vh;color:#222;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);padding:22px 12px}
body.light{background:#eef2f6;padding:0}
.card{background:rgba(255,255,255,.97);border-radius:18px;padding:24px 22px;width:100%;max-width:560px;margin:0 auto;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.logo{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
h1{margin:0;font-size:19px;color:#1F4E78;text-align:center}
.sub{text-align:center;font-size:12px;color:#666;margin:4px 0 16px}
.bar{background:#2E7D5B;color:#fff;font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px;margin:16px 0 10px;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column}.field.full{grid-column:1/-1}
label{font-size:11px;font-weight:700;color:#1F4E78;margin-bottom:3px}
label .req{color:#c0392b}
select,input{padding:9px 10px;border-radius:9px;border:1.5px solid #cfd8e3;font-size:14px;background:#f7f9fc;width:100%;font-family:inherit}
.reqf{background:#fff4ee;border-color:#f0b49a}
select:focus,input:focus{outline:none;border-color:#2E7D5B;background:#fff}
.hint{font-size:11px;color:#888;margin-top:8px}
.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#2E7D5B,#1F4E78);
  color:#fff;font-size:16px;font-weight:800;letter-spacing:.6px;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.err{color:#a4262c;font-weight:700;font-size:13px;margin-top:10px;text-align:center}
.userbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#555;margin-bottom:4px;gap:8px}
.userbar button,.linkbtn{background:none;border:0;color:#1F4E78;text-decoration:underline;cursor:pointer;font-size:12px;font-family:inherit}
.hidden{display:none}
.spin{text-align:center;color:#555;padding:30px;font-weight:700}

/* report */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:10px 14px;background:#1F4E78;position:sticky;top:0;z-index:5}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;background:#2E7D5B;color:#fff;font-family:inherit}
.btn.ghost{background:rgba(255,255,255,.15)}
.sheet{background:#fff;max-width:1400px;margin:14px auto;padding:18px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.head{text-align:center;margin-bottom:12px}
.head .logo2{width:70px;height:70px;object-fit:contain}
.college{font-size:22px;font-weight:800;color:#1F4E78;margin-top:4px}
.title{font-size:14px;color:#2E7D5B;font-weight:700;letter-spacing:.5px}
.filters{font-size:12px;color:#555;margin-top:6px}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.box{flex:1;min-width:110px;border-radius:8px;padding:8px;text-align:center}
.box .n{font-size:20px;font-weight:800}.box .l{font-size:11px}
.b1{background:#BDD7EE}.b2{background:#A9D18E}.b3{background:#F4A6A6}.b4{background:#FFE699}.b5{background:#C6E0B4}.b6{background:#F8CBAD}
.scroll{overflow-x:auto;border:1px solid #ccd}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #d0d7de;padding:4px 6px;text-align:center;white-space:nowrap}
th{background:#1F4E78;color:#fff}
th.dh{padding:4px 2px;vertical-align:bottom;height:70px}
.v{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px}
td.left{text-align:left}td.num{font-weight:700}
td.first,th.first{position:sticky;left:0;background:#f3f6fa;font-weight:800}th.first{background:#1F4E78}
tbody tr:nth-child(even) td:not(.c):not(.st):not(.first){background:#f8fafc}
td.c{width:24px;min-width:24px;font-weight:800;font-size:11px;padding:3px 0}
.p{background:#c6efce;color:#006100}.a{background:#ffc7ce;color:#9c0006}.u{background:#e5e5e5;color:#666}
td.st.ok{background:#c6efce;color:#006100;font-weight:700}td.st.no{background:#ffc7ce;color:#9c0006;font-weight:700}
.legend{margin-top:10px;font-size:12px}.legend .c{display:inline-block;padding:1px 8px;border-radius:4px;font-weight:800}
.empty{text-align:center;color:#a4262c;font-weight:700;padding:30px}
.foot{margin-top:10px;font-size:11px;color:#777;text-align:right}

/* report card */
.sheet.cardv{max-width:680px;padding:0;overflow:hidden}
.chead{background:linear-gradient(135deg,#1F4E78,#2E7D5B);color:#fff;text-align:center;padding:20px 14px 16px}
.clogo{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.clogo img{width:100%;height:100%;object-fit:contain;padding:4px}
.chead h2{margin:0;font-size:22px}.csub{font-size:12px;opacity:.9;margin-top:2px}
.cbody{padding:18px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:14px}
.il{font-size:11px;color:#888}.iv{font-weight:700}
.period{font-size:12px;color:#666;margin:10px 0 12px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.sb{flex:1;text-align:center;border-radius:10px;padding:10px 4px;color:#fff;font-size:10px}
.sb span{display:block;font-size:20px;font-weight:800}
.sb.g{background:#2E7D5B}.sb.r{background:#c0392b}.sb.b{background:#1F4E78}.sb.y{background:#a9710a}
.badge{display:inline-block;padding:6px 18px;border-radius:999px;font-weight:800;font-size:13px;margin-bottom:14px}
.okb{background:#d4f4dd;color:#1b7a3d}.nob{background:#fbd7d7;color:#a4262c}
table.ct{width:100%;border-collapse:collapse;font-size:13px}
.ct th{background:#1F4E78;color:#fff;padding:7px 6px;text-align:left}
.ct td{padding:6px;border-bottom:1px solid #eee;text-align:left;border-left:0;border-right:0}
.ct tr:nth-child(even) td{background:#f7f9fc}
.pill{padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}
.pp{background:#d4f4dd;color:#1b7a3d}.pa{background:#fbd7d7;color:#a4262c}.pu{background:#eee;color:#777}
.sheet.cardv .foot{padding:0 18px 14px}

@page{size:A4 landscape;margin:8mm}
@media print{
  body,body.light{background:#fff!important;padding:0}
  .no-print{display:none!important}
  .sheet{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}
  .sheet.cardv{max-width:680px;margin:0 auto}
  .scroll{overflow:visible;border:0}
  td.first,th.first{position:static}
  table{font-size:10px}th,td{padding:2px 4px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

/* ============================ helpers ============================ */
var $app = document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function p2(n){return String(n).padStart(2,'0');}
function parseIso(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3],12):null;}
function fmtIso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmtBn(s){var d=parseIso(s);return d?p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear():'';}
function fmtShort(s){var d=parseIso(s);return d?p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+String(d.getFullYear()).slice(2):'';}
function nowText(){var d=new Date();var h=d.getHours()%12||12;return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()+' '+p2(h)+':'+p2(d.getMinutes())+' '+(d.getHours()>=12?'PM':'AM');}
var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  del:function(k){try{localStorage.removeItem(k);}catch(e){}}};

/* ============================ auth + api ============================ */
var session=null, profile=null, rows=[], studentMap={}, lastQuery=null;

function loadSession(){try{session=JSON.parse(store.get('att_session')||'null');}catch(e){session=null;}}
function saveSession(s){session=s;if(s)store.set('att_session',JSON.stringify(s));else store.del('att_session');}

function authFromJson(j){
  return {access_token:j.access_token,refresh_token:j.refresh_token,
    expires_at:Date.now()+((j.expires_in||3600)*1000),
    user:{id:(j.user&&j.user.id)||(session&&session.user.id),email:(j.user&&j.user.email)||(session&&session.user.email)}};
}
async function signIn(email,password){
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.trim(),password:password})});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok){
    var code=j.error_code||j.code||'';
    if(code==='invalid_credentials')throw new Error('ইমেইল বা পাসওয়ার্ড ভুল।');
    if(code==='email_not_confirmed')throw new Error('এই ইমেইল এখনো নিশ্চিত করা হয়নি — অ্যাডমিনকে জানান।');
    throw new Error('সাইন-ইন হয়নি: '+(j.msg||j.error_description||r.status));
  }
  saveSession(authFromJson(j));
}
async function token(){
  if(!session)throw new Error('AUTH');
  if(session.expires_at>Date.now()+60000)return session.access_token;
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!r.ok){saveSession(null);throw new Error('AUTH');}
  saveSession(authFromJson(await r.json()));
  return session.access_token;
}
async function rest(path,params){
  var t=await token();
  var u=new URL(SB_URL+'/rest/v1/'+path);
  Object.keys(params||{}).forEach(function(k){u.searchParams.set(k,params[k]);});
  var r=await fetch(u,{headers:{apikey:SB_KEY,Authorization:'Bearer '+t}});
  if(r.status===401){saveSession(null);throw new Error('AUTH');}
  if(!r.ok)throw new Error('সার্ভার ত্রুটি ('+r.status+')');
  return r.json();
}
async function fetchAll(path,params){
  var out=[],off=0,page=1000;
  for(;;){
    var q=Object.assign({},params,{limit:page,offset:off});
    var list=await rest(path,q);
    out=out.concat(list);
    if(list.length<page)break;
    off+=page;
  }
  return out;
}
async function loadData(){
  profile=(await rest('profiles',{select:'role,full_name,email',id:'eq.'+session.user.id}))[0]||{role:'teacher'};
  rows=await fetchAll('attendance',{select:'class_date,day_name,batch,faculty,department,section,roll,student_name,mobile,status,teacher_name,teacher_id',order:'class_date.asc,id.asc'});
  var st=await fetchAll('students',{select:'batch,faculty,roll,name,mobile',order:'id.asc'});
  studentMap={};
  st.forEach(function(s){studentMap[s.batch+'|'+s.faculty+'|'+s.roll]={name:s.name||'',mobile:s.mobile||''};});
}

/* ============================ views ============================ */
function setView(html,light){document.body.className=light?'light':'';$app.innerHTML=html;window.scrollTo(0,0);}

function loginView(msg){
  setView('<div class="card"><div class="logo"><img src="'+LOGO+'" alt=""></div>'+
   '<h1>Attendance Report</h1><div class="sub">'+COLLEGE+'</div>'+
   '<div class="bar">SIGN IN</div>'+
   '<form id="lf"><div class="field"><label>Email</label><input id="em" type="email" autocomplete="username" required></div>'+
   '<div class="field" style="margin-top:10px"><label>Password</label><input id="pw" type="password" autocomplete="current-password" required></div>'+
   '<button class="go" id="lb" type="submit">SIGN IN</button><div class="err" id="le">'+esc(msg||'')+'</div></form></div>');
  document.getElementById('lf').onsubmit=async function(ev){
    ev.preventDefault();
    var b=document.getElementById('lb'),e=document.getElementById('le');
    b.disabled=true;e.textContent='';
    try{await signIn(document.getElementById('em').value,document.getElementById('pw').value);await start();}
    catch(err){b.disabled=false;e.textContent=(err.message==='Failed to fetch')?'ইন্টারনেট সংযোগ নেই।':err.message;}
  };
}

function uniq(key){var s={};rows.forEach(function(r){if(r[key]!=null&&r[key]!=='')s[r[key]]=1;});return Object.keys(s).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});}
function opts(list,first){return '<option value="">'+first+'</option>'+list.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');}

function searchView(){
  var q=lastQuery||{};
  var admin=profile&&profile.role==='admin';
  var teachers=admin?uniq('teacher_name'):[];
  var html='<div class="card"><div class="userbar"><span>'+esc(session.user.email)+(admin?' · Admin':'')+'</span>'+
   '<span><button id="refresh">ডেটা রিফ্রেশ</button> · <button id="logout">Sign out</button></span></div>'+
   '<div class="logo"><img src="'+LOGO+'" alt=""></div><h1>Attendance Report</h1><div class="sub">'+COLLEGE+'</div>'+
   '<form id="sf"><div class="bar">SEARCH (<span style="color:#ffd9cc">*</span> আবশ্যক)</div><div class="grid">'+
   '<div class="field"><label>Batch <span class="req">*</span></label><select id="batch" class="reqf" required>'+opts(uniq('batch'),'— বাছাই করুন —')+'</select></div>'+
   '<div class="field"><label>Faculty <span class="req">*</span></label><select id="faculty" class="reqf" required>'+opts(uniq('faculty'),'— বাছাই করুন —')+'</select></div>'+
   '<div class="field"><label>Department / Subject</label><select id="department">'+opts(uniq('department'),'সব')+'</select></div>'+
   '<div class="field"><label>Section</label><select id="section">'+opts(uniq('section'),'সব')+'</select></div>'+
   '<div class="field"><label>Roll (দিলে Report Card খুলবে)</label><input id="roll" inputmode="numeric" placeholder="যেমন 1191"></div>'+
   '<div class="field"><label>Name (অংশবিশেষ)</label><input id="name" placeholder="নাম"></div>'+
   '<div class="field full"><label>Mobile (অংশবিশেষ)</label><input id="mobile" placeholder="মোবাইল নম্বর"></div>'+
   (admin?'<div class="field full"><label>শিক্ষক (Admin)</label><select id="teacher">'+opts(teachers,'সব শিক্ষক')+'</select></div>':'')+
   '</div><div class="bar">PERIOD (ঐচ্ছিক — না দিলে সব তারিখ)</div><div class="grid">'+
   '<div class="field"><label>Period</label><select id="period"><option value="All">All (সব তারিখ)</option><option>Weekly</option><option>Monthly</option><option>Annual</option><option>Custom</option></select></div>'+
   '<div class="field" id="refbox"><label>Reference Date</label><input id="ref" type="date"></div>'+
   '<div class="field hidden" id="frombox"><label>From</label><input id="from" type="date"></div>'+
   '<div class="field hidden" id="tobox"><label>To</label><input id="to" type="date"></div>'+
   '</div><div class="hint">Weekly/Monthly/Annual-এ Reference Date-এর তারিখ যে সপ্তাহ/মাস/বছরে পড়ে সেটা ধরা হবে (ফাঁকা থাকলে আজকের তারিখ)। সপ্তাহ রবিবার থেকে শনিবার।</div>'+
   '<div class="bar">ELIGIBILITY</div><div class="field"><label>Collegiate Threshold (%)</label><input id="th" type="number" min="1" max="100" value="'+(q.threshold||DEFAULT_TH)+'"></div>'+
   '<button class="go" type="submit">🔍 SEARCH</button><div class="err" id="se"></div></form>'+
   '<div class="hint" style="text-align:center">মোট '+rows.length+'টি হাজিরার সারি লোড হয়েছে।</div></div>';
  setView(html);
  ['batch','faculty','department','section','roll','name','mobile','teacher','period','ref','from','to'].forEach(function(id){
    var el=document.getElementById(id);if(el&&q[id]!=null)el.value=q[id];
  });
  function togglePeriod(){
    var t=document.getElementById('period').value;
    document.getElementById('refbox').classList.toggle('hidden',!(t==='Weekly'||t==='Monthly'||t==='Annual'));
    document.getElementById('frombox').classList.toggle('hidden',t!=='Custom');
    document.getElementById('tobox').classList.toggle('hidden',t!=='Custom');
  }
  document.getElementById('period').onchange=togglePeriod;togglePeriod();
  document.getElementById('logout').onclick=function(){saveSession(null);rows=[];profile=null;loginView();};
  document.getElementById('refresh').onclick=async function(){setView('<div class="spin">ডেটা লোড হচ্ছে…</div>');try{await loadData();searchView();}catch(e){fail(e);}};
  document.getElementById('sf').onsubmit=function(ev){
    ev.preventDefault();
    var g=function(id){var el=document.getElementById(id);return el?el.value.trim():'';};
    var th=Number(g('th'));if(!th||th<1||th>100)th=DEFAULT_TH;
    lastQuery={batch:g('batch'),faculty:g('faculty'),department:g('department'),section:g('section'),roll:g('roll'),name:g('name'),
      mobile:g('mobile'),teacher:g('teacher'),period:g('period'),ref:g('ref'),from:g('from'),to:g('to'),threshold:th};
    if(!lastQuery.batch||!lastQuery.faculty){document.getElementById('se').textContent='Batch ও Faculty — দুটোই বাছাই করুন।';return;}
    reportView(lastQuery);
  };
}

/* ============================ period + calc ============================ */
function resolvePeriod(q){
  var type=q.period||'All',ref=parseIso(q.ref)||new Date();
  ref=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate(),12);
  var from='',to='';
  if(type==='Weekly'){var s=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate()-ref.getDay(),12);
    var e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6,12);from=fmtIso(s);to=fmtIso(e);}
  else if(type==='Monthly'){from=fmtIso(new Date(ref.getFullYear(),ref.getMonth(),1,12));to=fmtIso(new Date(ref.getFullYear(),ref.getMonth()+1,0,12));}
  else if(type==='Annual'){from=fmtIso(new Date(ref.getFullYear(),0,1,12));to=fmtIso(new Date(ref.getFullYear(),11,31,12));}
  else if(type==='Custom'){from=parseIso(q.from)?q.from:'';to=parseIso(q.to)?q.to:'';}
  var label=(type==='All'||(!from&&!to))?'সব তারিখ':(fmtBn(from)||'…')+' থেকে '+(fmtBn(to)||'…');
  return {type:type,from:from,to:to,label:label};
}
function pct(pr,ab){return (pr+ab)>0?Math.round(pr/(pr+ab)*100):null;}
function markOf(p){return p===null?'':Math.round(p/100*5*10)/10;}

function filterRows(q,period){
  var nameQ=(q.name||'').toLowerCase(),mobQ=q.mobile||'';
  return rows.filter(function(r){
    if(String(r.batch)!==q.batch||String(r.faculty)!==q.faculty)return false;
    if(q.department&&r.department!==q.department)return false;
    if(q.section&&r.section!==q.section)return false;
    if(q.roll&&String(r.roll)!==q.roll)return false;
    if(q.teacher&&r.teacher_name!==q.teacher)return false;
    if(period.from&&r.class_date<period.from)return false;
    if(period.to&&r.class_date>period.to)return false;
    var sm=studentMap[r.batch+'|'+r.faculty+'|'+r.roll]||{};
    var nm=r.student_name||sm.name||'',mb=r.mobile||sm.mobile||'';
    if(nameQ&&nm.toLowerCase().indexOf(nameQ)<0)return false;
    if(mobQ&&mb.indexOf(mobQ)<0)return false;
    return true;
  });
}

function buildClass(q,period,list){
  var students={},dateSet={};
  list.forEach(function(r){
    var s=students[r.roll];
    if(!s)s=students[r.roll]={roll:r.roll,name:'',mobile:'',section:'',days:{}};
    var sm=studentMap[r.batch+'|'+r.faculty+'|'+r.roll]||{};
    if(r.student_name||sm.name)s.name=r.student_name||sm.name;
    if(r.mobile||sm.mobile)s.mobile=r.mobile||sm.mobile;
    s.section=r.section;
    s.days[r.class_date]=r.status;dateSet[r.class_date]=1;
  });
  var dates=Object.keys(dateSet).sort();
  var arr=Object.keys(students).map(function(k){return students[k];}).sort(function(a,b){return Number(a.roll)-Number(b.roll);});
  var tp=0,ta=0,col=0,non=0,ps=0,pn=0;
  arr.forEach(function(s){
    var pr=0,ab=0;
    dates.forEach(function(d){if(s.days[d]==='Present')pr++;else if(s.days[d]==='Absent')ab++;});
    s.present=pr;s.absent=ab;s.percent=pct(pr,ab);
    s.status=s.percent===null?'':(s.percent>=q.threshold?'Collegiate':'Non-Collegiate');
    s.mark=markOf(s.percent);
    tp+=pr;ta+=ab;if(s.status==='Collegiate')col++;if(s.status==='Non-Collegiate')non++;
    if(s.percent!==null){ps+=s.percent;pn++;}
  });
  return {dates:dates,list:arr,tp:tp,ta:ta,col:col,non:non,avg:pn?Math.round(ps/pn)+'%':'-'};
}

/* ============================ report view ============================ */
function filterText(q,period){
  return ['Batch: '+q.batch,'Faculty: '+q.faculty,q.department?'Department/Subject: '+q.department:'',q.section?'Section: '+q.section:'',
    q.roll?'Roll: '+q.roll:'',q.teacher?'শিক্ষক: '+q.teacher:'','সময়: '+period.label].filter(Boolean).join('  •  ');
}
function toolbar(){
  return '<div class="toolbar no-print"><div class="grp"><button class="btn ghost" id="back">← নতুন Search</button></div>'+
   '<div class="grp"><button class="btn" id="bprint">🖨️ Print / PDF</button><button class="btn" id="bxlsx">📗 Excel</button><button class="btn" id="bcsv">📄 CSV</button></div></div>';
}
function reportView(q){
  var period=resolvePeriod(q),list=filterRows(q,period);
  if(q.roll)return cardView(q,period,list);
  var d=buildClass(q,period,list);
  var h=toolbar()+'<div class="sheet"><div class="head"><img class="logo2" src="'+LOGO+'" alt=""><div class="college">'+COLLEGE+'</div>'+
   '<div class="title">Attendance Report</div><div class="filters">'+esc(filterText(q,period))+'</div></div><div class="summary">';
  [['Total Students',d.list.length,'b1'],['Total Present',d.tp,'b2'],['Total Absent',d.ta,'b3'],['Average %',d.avg,'b4'],
   ['Collegiate (≥'+q.threshold+'%)',d.col,'b5'],['Non-Collegiate',d.non,'b6']].forEach(function(b){
    h+='<div class="box '+b[2]+'"><div class="n">'+esc(b[1])+'</div><div class="l">'+esc(b[0])+'</div></div>';});
  h+='</div>';
  if(!d.list.length){h+='<p class="empty">কোনো তথ্য পাওয়া যায়নি — Filter বা সময় বদলে আবার চেষ্টা করুন।</p>';}
  else{
    h+='<div class="scroll"><table><thead><tr>';
    ['Roll','Name','Mobile','Section','Total Present','Total Absent','%','Status','Mark /5'].forEach(function(c,i){h+='<th class="'+(i===0?'first ':'')+'ih">'+c+'</th>';});
    d.dates.forEach(function(x){h+='<th class="dh"><span class="v">'+esc(fmtShort(x))+'</span></th>';});
    h+='</tr></thead><tbody>';
    d.list.forEach(function(s){
      var sc=s.status==='Collegiate'?'ok':(s.status==='Non-Collegiate'?'no':'');
      h+='<tr><td class="first">'+esc(s.roll)+'</td><td class="left">'+esc(s.name)+'</td><td>'+esc(s.mobile)+'</td><td>'+esc(s.section)+'</td>'+
        '<td class="num">'+s.present+'</td><td class="num">'+s.absent+'</td><td class="num">'+(s.percent===null?'':s.percent+'%')+'</td>'+
        '<td class="st '+sc+'">'+esc(s.status)+'</td><td class="num">'+esc(s.mark)+'</td>';
      d.dates.forEach(function(x){var v=s.days[x];var c=v==='Present'?'p':(v==='Absent'?'a':'n');var ch=v==='Present'?'P':(v==='Absent'?'A':'');h+='<td class="c '+c+'">'+ch+'</td>';});
      h+='</tr>';
    });
    h+='</tbody></table></div><div class="legend"><span class="c p">P</span> Present &nbsp; <span class="c a">A</span> Absent</div>';
  }
  h+='<div class="foot">Printed: '+nowText()+'</div></div>';
  setView(h,true);
  bindToolbar('Attendance_'+q.faculty+'_'+q.batch,function(){return classAoa(q,period,d);});
}
function classAoa(q,period,d){
  var a=[[COLLEGE],['Attendance Report'],[filterText(q,period)],[]];
  a.push(['Roll','Name','Mobile','Section','Total Present','Total Absent','%','Status','Mark /5'].concat(d.dates.map(fmtBn)));
  d.list.forEach(function(s){
    a.push([Number(s.roll),s.name,s.mobile,s.section,s.present,s.absent,s.percent===null?'':s.percent/100,s.status,s.mark].concat(d.dates.map(function(x){return s.days[x]==='Present'?'P':(s.days[x]==='Absent'?'A':'');})));
  });
  a.push([]);a.push(['Total Students',d.list.length,'Present',d.tp,'Absent',d.ta,'Average',d.avg,'Collegiate',d.col,'Non-Collegiate',d.non]);
  return a;
}

/* ============================ report card ============================ */
function cardView(q,period,list){
  if(!list.length){
    setView(toolbar().replace(/<div class="grp"><button class="btn" id="bprint">[\s\S]*<\/div><\/div>$/,'</div>')+
      '<div class="sheet"><p class="empty">Roll '+esc(q.roll)+' — কোনো তথ্য পাওয়া যায়নি। Batch / Faculty / সময় মিলিয়ে আবার দেখুন।</p></div>',true);
    document.getElementById('back').onclick=searchView;return;
  }
  var info=list[list.length-1],sm=studentMap[info.batch+'|'+info.faculty+'|'+info.roll]||{};
  var name=info.student_name||sm.name||'-',mobile=info.mobile||sm.mobile||'-';
  var recs=list.slice().sort(function(a,b){return a.class_date<b.class_date?-1:(a.class_date>b.class_date?1:(a.department<b.department?-1:1));});
  var ds={},pr=0,ab=0;
  recs.forEach(function(r){var x=ds[r.department]||(ds[r.department]={p:0,a:0});if(r.status==='Present'){pr++;x.p++;}else if(r.status==='Absent'){ab++;x.a++;}});
  var names=Object.keys(ds).sort(),multi=names.length>1,pc=pct(pr,ab)||0,mk=markOf(pc),st=pc>=q.threshold?'Collegiate':'Non-Collegiate';
  var h=toolbar()+'<div class="sheet cardv"><div class="chead"><div class="clogo"><img src="'+LOGO+'" alt=""></div><h2>'+COLLEGE+'</h2><div class="csub">Student Attendance Report Card</div></div><div class="cbody"><div class="info">';
  [['Roll',info.roll],['Name',name],['Mobile',mobile],['Batch',q.batch],['Faculty',q.faculty],['Section',info.section||'-']].forEach(function(x){
    h+='<div><div class="il">'+x[0]+'</div><div class="iv">'+esc(x[1])+'</div></div>';});
  h+='</div><div class="period">সময়: '+esc(period.label)+'</div><div class="stats"><div class="sb g"><span>'+pr+'</span>PRESENT</div><div class="sb r"><span>'+ab+
    '</span>ABSENT</div><div class="sb b"><span>'+pc+'%</span>ATTENDANCE</div><div class="sb y"><span>'+mk+'</span>MARK / 5</div></div>'+
    '<div style="text-align:center"><span class="badge '+(st==='Collegiate'?'okb':'nob')+'">মন্তব্য: '+st+'</span></div>';
  if(multi){
    h+='<table class="ct"><thead><tr><th>Subject</th><th>Present</th><th>Absent</th><th>%</th></tr></thead><tbody>';
    names.forEach(function(n){var x=ds[n],t=x.p+x.a;h+='<tr><td>'+esc(n)+'</td><td>'+x.p+'</td><td>'+x.a+'</td><td>'+(t?Math.round(x.p/t*100)+'%':'')+'</td></tr>';});
    h+='</tbody></table><div style="height:12px"></div>';
  }
  h+='<table class="ct"><thead><tr><th>Date</th><th>Day</th>'+(multi?'<th>Subject</th>':'')+'<th>Status</th></tr></thead><tbody>';
  recs.forEach(function(r){var c=r.status==='Present'?'pp':(r.status==='Absent'?'pa':'pu');
    h+='<tr><td>'+fmtBn(r.class_date)+'</td><td>'+esc(r.day_name)+'</td>'+(multi?'<td>'+esc(r.department)+'</td>':'')+'<td><span class="pill '+c+'">'+esc(r.status)+'</span></td></tr>';});
  h+='</tbody></table></div><div class="foot">Printed: '+nowText()+'</div></div>';
  setView(h,true);
  bindToolbar('ReportCard_Roll_'+q.roll,function(){
    var a=[[COLLEGE],['Student Attendance Report Card'],[],['Roll',info.roll],['Name',name],['Mobile',mobile],['Batch',q.batch],['Faculty',q.faculty],
      ['Section',info.section||''],['সময়',period.label],[],['Present',pr],['Absent',ab],['Attendance %',pc/100],['Mark /5',mk],['মন্তব্য',st],[]];
    a.push(['Date','Day','Subject','Status']);
    recs.forEach(function(r){a.push([fmtBn(r.class_date),r.day_name,r.department,r.status]);});
    return a;
  });
}

/* ============================ export ============================ */
function bindToolbar(fileBase,aoaFn){
  document.getElementById('back').onclick=searchView;
  document.getElementById('bprint').onclick=function(){var t=document.title;document.title=fileBase;window.print();document.title=t;};
  document.getElementById('bcsv').onclick=function(){
    var csv='﻿'+aoaFn().map(function(r){return r.map(function(c){c=(c==null?'':String(c));return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=fileBase+'.csv';
    document.body.appendChild(a);a.click();a.remove();
  };
  document.getElementById('bxlsx').onclick=function(){
    if(typeof XLSX==='undefined'){alert('Excel লাইব্রেরি লোড হয়নি — ইন্টারনেট দেখে পাতা রিফ্রেশ করুন, অথবা CSV নিন।');return;}
    var ws=XLSX.utils.aoa_to_sheet(aoaFn()),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Report');XLSX.writeFile(wb,fileBase+'.xlsx');
  };
}

/* ============================ boot ============================ */
function fail(e){
  if(e&&e.message==='AUTH'){loginView('সাইন-ইনের মেয়াদ শেষ — আবার সাইন-ইন করুন।');return;}
  setView('<div class="card"><div class="err">'+esc(e&&e.message==='Failed to fetch'?'ইন্টারনেট সংযোগ নেই।':(e&&e.message)||'ত্রুটি')+'</div><button class="go" onclick="start()">আবার চেষ্টা করুন</button></div>');
}
async function start(){
  loadSession();
  if(!session){loginView();return;}
  setView('<div class="card"><div class="logo"><img src="'+LOGO+'" alt=""></div><div class="spin">ডেটা লোড হচ্ছে…</div></div>');
  try{await loadData();searchView();}catch(e){fail(e);}
}
start();
