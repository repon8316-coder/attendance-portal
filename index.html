<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Portal — রংপুর সরকারি কলেজ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1b2d;--muted:#5b6b82;--line:#e3e9f2;--bg:#f2f5fa;--card:#ffffff;
  --brand:#0e3b6e;--brand2:#14806b;--accent:#e8a317;
  --ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.08);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Hind Siliguri','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.auth{background:radial-gradient(1200px 600px at 10% -10%,#1d6fb8 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#14806b 0,transparent 55%),linear-gradient(160deg,#0a2748,#0e3b6e 60%,#0b5a56);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.spin{padding:80px 20px;text-align:center;color:var(--muted)}
.spin:before{content:"";display:block;width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s ease both}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:100%;max-width:410px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-radius:24px;padding:34px 28px 28px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}
.llogo{width:96px;height:96px;margin:-82px auto 12px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.llogo img{width:80%;height:80%;object-fit:contain}
.lcard h1{margin:34px 0 2px;font-size:24px;color:var(--brand)}
.lcard .sub{color:var(--muted);margin-bottom:22px}
.fld{text-align:left;margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.2px}
input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(14,59,110,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;color:#fff;background:linear-gradient(135deg,var(--brand),#1b5ea8);box-shadow:0 6px 16px rgba(14,59,110,.28);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(14,59,110,.32)}
.btn.block{width:100%;padding:13px}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.btn.green{background:linear-gradient(135deg,#14806b,#0f9a7e);box-shadow:0 6px 16px rgba(20,128,107,.28)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.err{color:var(--bad);background:var(--badbg);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:14px;text-align:left}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,#0a2748,#0e3b6e 55%,#0d6a62);color:#fff;box-shadow:0 6px 24px rgba(10,39,72,.35)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer}
.brand .lg{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .lg img{width:84%;height:84%;object-fit:contain}
.brand b{display:block;font-size:17px;line-height:1.15;white-space:nowrap}
.brand small{opacity:.8;font-size:12px}
.sp{flex:1}
.sbox{position:relative;width:min(430px,46vw)}
.sbox input{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);color:#fff;padding:10px 40px 10px 40px;border-radius:999px}
.sbox input::placeholder{color:rgba(255,255,255,.72)}
.sbox input:focus{background:rgba(255,255,255,.22);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.16)}
.sbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.85;pointer-events:none}
.sbox .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:18px;opacity:.8;display:none}
.sbox.has .x{display:block}
.who{position:relative}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px 6px 7px;font-size:13.5px;max-width:230px}
.chip i{font-style:normal;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--shadow);min-width:230px;padding:6px;display:none;z-index:60}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:9px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;font-size:14.5px;color:var(--ink)}
.menu button:hover{background:var(--bg)}
.menu .role{padding:8px 12px 6px;font-size:12px;color:var(--muted)}

/* ---------- page ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
.hero{background:linear-gradient(135deg,#fff,#f4f8ff);border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h2{margin:0 0 4px;font-size:22px;color:var(--brand)}
.hero p{margin:0;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px}
.sec{font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--brand2);margin:0 0 12px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.hint{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.tag{background:#eaf2ff;color:var(--brand);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.tag.g{background:#e3f6f1;color:#0b6b59}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}
.stat{border-radius:16px;padding:16px 18px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.stat:after{content:"";position:absolute;right:-26px;top:-26px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.16)}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{opacity:.92;font-size:13.5px}
.stat.s1{background:linear-gradient(135deg,#1b5ea8,#3b82c4)}
.stat.s2{background:linear-gradient(135deg,#15803d,#34a853)}
.stat.s3{background:linear-gradient(135deg,#c2410c,#ea7a3a)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar .l,.bar .r{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* table */
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:74vh;position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
thead th{position:sticky;top:0;z-index:5;background:linear-gradient(#143f73,#0e3b6e);color:#fff;padding:11px 10px;text-align:center;font-weight:600;white-space:nowrap;border-right:1px solid rgba(255,255,255,.12);user-select:none}
th .cell{display:inline-flex;align-items:center;gap:5px}
th .so,th .fi{opacity:.6;font-size:11px;padding:2px 4px;border-radius:6px;cursor:pointer}
th .so:hover,th .fi:hover{opacity:1;background:rgba(255,255,255,.2)}
th .on{opacity:1;background:rgba(255,255,255,.28)}
th.dt{padding:8px 3px;min-width:34px;cursor:pointer}
th.dt .v{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;display:inline-block}
th.dt.fa{background:#9b1c1c}th.dt.fp{background:#146c3a}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
td.l{text-align:left}
tbody tr:nth-child(even) td{background:#f8fafd}
tbody tr{transition:.12s}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:#e9f1ff}
td.roll{font-weight:700;background:#f1f5fb!important}
/* frozen first 3 columns */
table.ct th:nth-child(1),table.ct td:nth-child(1){position:sticky;left:0;width:72px;min-width:72px;max-width:72px}
table.ct th:nth-child(2),table.ct td:nth-child(2){position:sticky;left:72px;width:190px;min-width:190px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.ct th:nth-child(3),table.ct td:nth-child(3){position:sticky;left:262px;width:120px;min-width:120px;max-width:120px;box-shadow:3px 0 6px -3px rgba(15,40,80,.35)}
table.ct td:nth-child(1),table.ct td:nth-child(2),table.ct td:nth-child(3){z-index:3;background:#fff}
table.ct tbody tr:nth-child(even) td:nth-child(-n+3){background:#f4f7fc}
table.ct tbody tr.clk:hover td:nth-child(-n+3){background:#e9f1ff}
table.ct td.roll{background:#eaf0fa!important}
table.ct thead th:nth-child(-n+3){z-index:8}

.pa{display:inline-block;min-width:22px;border-radius:6px;font-weight:700;font-size:13px;padding:1px 0}
.pa.P{background:var(--okbg);color:var(--ok)}
.pa.A{background:var(--badbg);color:var(--bad)}
.st{border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;display:inline-block}
.st.c{background:var(--okbg);color:var(--ok)}
.st.n{background:var(--badbg);color:var(--bad)}
.bar2{height:7px;border-radius:99px;background:#e8edf5;overflow:hidden;min-width:60px}
.bar2 i{display:block;height:100%;border-radius:99px}
.pop{position:fixed;z-index:80;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 18px 48px rgba(10,39,72,.28);padding:12px;width:230px;border:1px solid var(--line)}
.pop .t{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.pop .acts{display:flex;gap:8px;margin-top:9px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}

/* result cards */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.rc:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(14,59,110,.18)}
.rc h4{margin:0;font-size:16.5px}
.rc .m{color:var(--muted);font-size:13px;margin:2px 0 10px}
.rc .nums{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.rc .nums b{color:var(--ink);font-size:15px}
.rc .rl{position:absolute;right:12px;top:12px;background:#eaf2ff;color:var(--brand);font-weight:700;border-radius:10px;padding:3px 10px;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,20,38,.55);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h3{margin:0 0 4px;color:var(--brand)}
.drop{border:2px dashed #b9c8df;border-radius:14px;padding:20px;text-align:center;color:var(--muted);margin:14px 0;background:#f7faff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:11px 18px;border-radius:12px;z-index:120;box-shadow:var(--shadow);animation:rise .3s}

/* ---------- student report sheet ---------- */
.sheetwrap{display:flex;justify-content:center;padding:6px 0 40px}
.sheet{width:210mm;height:297mm;background:#fff;box-shadow:0 12px 50px rgba(10,39,72,.25);padding:13mm 14mm 11mm;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#111}
.sheet:before{content:"";position:absolute;inset:6mm;border:1.2px solid #0e3b6e;border-radius:3mm;pointer-events:none}
.sheet:after{content:"";position:absolute;inset:7.6mm;border:.4px solid #9db4d4;border-radius:2.2mm;pointer-events:none}
.sh-head{text-align:center;padding-top:2mm}
.sh-head img{width:22mm;height:22mm;object-fit:contain}
.sh-head h1{margin:2mm 0 0;font-size:21pt;color:#0e3b6e;line-height:1.15}
.sh-head h2{margin:1mm 0 0;font-size:12pt;letter-spacing:2px;color:#14806b;text-transform:uppercase}
.sh-rule{height:1.2mm;margin:3mm 0 3.5mm;background:linear-gradient(90deg,transparent,#0e3b6e,#14806b,transparent);border-radius:9px}
.sh-info{display:grid;grid-template-columns:1fr 1fr;gap:1.4mm 7mm;font-size:11.5pt;border:.3mm solid #cfdaea;border-radius:2.5mm;padding:3.2mm 4mm;background:#f6f9fe}
.sh-info div{display:flex;gap:2mm}.sh-info span{color:#4b5d78;min-width:25mm}.sh-info b{font-weight:600}
.sh-info .full{grid-column:1/-1}
.sh-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin:3.5mm 0}
.sh-sum div{border-radius:2.5mm;text-align:center;padding:2.4mm 1mm;border:.3mm solid #cfdaea}
.sh-sum b{display:block;font-size:17pt;line-height:1.1}
.sh-sum span{font-size:9pt;color:#4b5d78}
.sh-sum .a{background:#eaf2ff}.sh-sum .b{background:#e6f7ec}.sh-sum .c{background:#fdecec}.sh-sum .d{background:#fff6e0}.sh-sum .e{background:#efe9ff}
.sh-t{font-size:11.5pt;font-weight:700;color:#0e3b6e;margin:2.6mm 0 1.4mm;display:flex;align-items:center;gap:2mm}
.sh-t:before{content:"";width:1.4mm;height:4mm;background:#14806b;border-radius:2px}
.sh table{font-size:10.5pt}
.sh th{position:static;background:#0e3b6e;color:#fff;padding:1.8mm 2mm;border:.2mm solid #0e3b6e;font-size:10pt}
.sh td{padding:1.7mm 2mm;border:.2mm solid #cfdaea;background:#fff!important;text-align:center}
.sh td.l{text-align:left}
.dates{display:flex;flex-wrap:wrap;gap:1mm}
.dates i{font-style:normal;font-size:8.6pt;padding:.7mm 1.6mm;border-radius:1.2mm;border:.2mm solid;line-height:1.25}
.dates i.P{background:#e6f7ec;border-color:#9ad6b0;color:#146c3a}
.dates i.A{background:#fdecec;border-color:#f1aaaa;color:#a11a1a}
.sh-fill{flex:1}
.sh-foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:8.5pt;color:#4b5d78}
.sig{width:62mm;text-align:center;font-size:11pt;color:#111}
.sig .ln{border-top:.35mm solid #111;margin:0 auto 1.3mm;width:46mm;margin-top:17mm}
.sig b{font-weight:600}

/* ---------- print ---------- */
@media print{
  table.ct th,table.ct td{position:static!important;box-shadow:none!important}
  body{background:#fff}
  .top,.no-print,.toast,.pop{display:none!important}
  .wrap{padding:0;max-width:none}
  .tw{max-height:none;overflow:visible;box-shadow:none;border:0}
  thead th{position:static}
  .panel,.hero{box-shadow:none}
  .sheetwrap{padding:0}
  .sheet{box-shadow:none;height:296mm;page-break-after:avoid;break-after:avoid}
  .sheetwrap{display:block;padding:0;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.pstudent .wrap>*:not(.sheetwrap){display:none!important}
  body.pclass table{font-size:9px}
  body.pclass th,body.pclass td{padding:2px 4px}
  body.pclass .stats{margin-bottom:8px}
  body.pclass .stat b{font-size:18px}
  body.pclass .stat{padding:8px 12px;box-shadow:none}
  body.pclass .rise{animation:none}
}
@media(max-width:760px){
  .top .in{flex-wrap:wrap;gap:9px}
  .sbox{order:5;width:100%}
  .brand b{font-size:15px}.brand small{display:none}
  .chip span{display:none}.chip{padding:5px}
  .stats{grid-template-columns:1fr}
  .stat b{font-size:24px}
  .wrap{padding:14px 12px 50px}
}
</style>
</head>
<body>
<div id="app"><div class="spin">লোড হচ্ছে…</div></div>
<style id="pagestyle"></style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================ config ============================ */
var SB_URL='https://dufcrgevulwvvfbwqifm.supabase.co';
var SB_KEY='sb_publishable_RNR0Q0iCVpY_KMAGaHUrgg_XPJeipzH'; // publishable key: safe to be public
var COLLEGE='রংপুর সরকারি কলেজ, রংপুর';

var $app=document.getElementById('app');
var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function p2(n){return String(n).padStart(2,'0');}
function parseIso(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3],12):null;}
function fmtIso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmtBn(s){var d=parseIso(s);return d?p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear():'';}
function fmtShort(s){var d=parseIso(s);return d?p2(d.getDate())+'/'+p2(d.getMonth()+1):'';}
function nowText(){var d=new Date();var h=d.getHours()%12||12;return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()+' '+p2(h)+':'+p2(d.getMinutes())+' '+(d.getHours()>=12?'PM':'AM');}
function pct(pr,ab){return(pr+ab)>0?Math.round(pr/(pr+ab)*100):null;}
function markOf(p){return p===null?'':Math.round(p/100*5*10)/10;}
function numSort(a,b){return a.localeCompare(b,undefined,{numeric:true});}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},3200);}
function setPage(size){document.getElementById('pagestyle').textContent='@page{size:'+size+';margin:'+(size.indexOf('landscape')>=0?'8mm':'0')+'}';}

/* ============================ auth + api ============================ */
var session=null,profile=null,rows=[],roster={},TH=DEFAULT_TH;
function loadSession(){try{session=JSON.parse(store.get('att_session')||'null');}catch(e){session=null;}}
function saveSession(s){session=s;if(s)store.set('att_session',JSON.stringify(s));else store.del('att_session');}
function authFromJson(j){return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+((j.expires_in||3600)*1000),
  user:{id:(j.user&&j.user.id)||(session&&session.user.id),email:(j.user&&j.user.email)||(session&&session.user.email)}};}
async function signIn(email,password){
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.trim(),password:password})});
  var j=await r.json().catch(function(){return{};});
  if(!r.ok){var code=j.error_code||j.code||'';
    if(code==='invalid_credentials')throw new Error('ইমেইল বা পাসওয়ার্ড ভুল।');
    if(code==='email_not_confirmed')throw new Error('এই ইমেইল এখনো নিশ্চিত করা হয়নি — অ্যাডমিনকে জানান।');
    throw new Error('সাইন-ইন হয়নি: '+(j.msg||j.error_description||r.status));}
  saveSession(authFromJson(j));
}
async function token(){
  if(!session)throw new Error('AUTH');
  if(session.expires_at>Date.now()+60000)return session.access_token;
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!r.ok){saveSession(null);throw new Error('AUTH');}
  saveSession(authFromJson(await r.json()));return session.access_token;
}
async function rest(path,params){
  var t=await token();var u=new URL(SB_URL+'/rest/v1/'+path);
  Object.keys(params||{}).forEach(function(k){u.searchParams.set(k,params[k]);});
  var r=await fetch(u,{headers:{apikey:SB_KEY,Authorization:'Bearer '+t}});
  if(r.status===401){saveSession(null);throw new Error('AUTH');}
  if(!r.ok)throw new Error('সার্ভার ত্রুটি ('+r.status+')');
  return r.json();
}
async function rpc(name,body){
  var t=await token();
  var r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){saveSession(null);throw new Error('AUTH');}
  if(!r.ok)throw new Error('সার্ভার ত্রুটি ('+r.status+')');
  return r.json();
}
async function fetchAll(path,params){
  var out=[],off=0,page=1000;
  for(;;){var list=await rest(path,Object.assign({},params,{limit:page,offset:off}));out=out.concat(list);if(list.length<page)break;off+=page;}
  return out;
}
async function upsertRoster(list){
  var t=await token();
  for(var i=0;i<list.length;i+=400){
    var part=list.slice(i,i+400);
    var r=await fetch(SB_URL+'/rest/v1/roster?on_conflict=batch,faculty,roll',{method:'POST',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(part)});
    if(!r.ok){if(r.status===401||r.status===403)throw new Error('শুধু Admin আপলোড করতে পারেন।');throw new Error('আপলোড হয়নি ('+r.status+')');}
  }
}
async function loadData(){
  profile=(await rest('profiles',{select:'role,full_name,email',id:'eq.'+session.user.id}))[0]||{role:'teacher'};
  rows=await fetchAll('attendance',{select:'class_date,day_name,batch,faculty,department,section,roll,student_name,mobile,status,teacher_name,teacher_id',order:'class_date.asc,id.asc'});
  var st=await fetchAll('students',{select:'batch,faculty,roll,name,mobile',order:'id.asc'});
  var ro=await fetchAll('roster',{select:'batch,faculty,roll,name,mobile,father_name,father_mobile',order:'id.asc'});
  roster={};
  st.forEach(function(s){roster[s.batch+'|'+s.faculty+'|'+s.roll]={name:s.name||'',mobile:s.mobile||'',fname:'',fmobile:'',has:false};});
  ro.forEach(function(s){var k=s.batch+'|'+s.faculty+'|'+s.roll,o=roster[k]||{};
    roster[k]={name:s.name||o.name||'',mobile:s.mobile||o.mobile||'',fname:s.father_name||'',fmobile:s.father_mobile||'',has:true};});
}
function isAdmin(){return profile&&profile.role==='admin';}
function info(r){var s=roster[r.batch+'|'+r.faculty+'|'+r.roll]||{};return{name:r.student_name||s.name||'',mobile:r.mobile||s.mobile||''};}

/* ============================ home (filters + class report) ============================ */
var cq={batch:'',faculty:'',department:'',section:'',period:'All',ref:'',from:'',to:''};
var colf={},sortK='roll',sortDir=1,dateF={};
function uniq(list,key){var s={};list.forEach(function(r){if(r[key]!=null&&r[key]!=='')s[r[key]]=1;});return Object.keys(s).sort(numSort);}
function opts(list,sel,first){return '<option value="">'+first+'</option>'+list.map(function(x){return '<option'+(String(x)===String(sel)?' selected':'')+'>'+esc(x)+'</option>';}).join('');}

function resolvePeriod(q){
  var type=q.period||'All',ref=parseIso(q.ref)||new Date();ref=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate(),12);
  var from='',to='';
  if(type==='Weekly'){var s=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate()-ref.getDay(),12),e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6,12);from=fmtIso(s);to=fmtIso(e);}
  else if(type==='Monthly'){from=fmtIso(new Date(ref.getFullYear(),ref.getMonth(),1,12));to=fmtIso(new Date(ref.getFullYear(),ref.getMonth()+1,0,12));}
  else if(type==='Annual'){from=fmtIso(new Date(ref.getFullYear(),0,1,12));to=fmtIso(new Date(ref.getFullYear(),11,31,12));}
  else if(type==='Custom'){from=parseIso(q.from)?q.from:'';to=parseIso(q.to)?q.to:'';}
  var label=(type==='All'||(!from&&!to))?'সব তারিখ':(fmtBn(from)||'…')+' থেকে '+(fmtBn(to)||'…');
  return{type:type,from:from,to:to,label:label};
}

function homeView(){
  if(!cq.batch){var b=uniq(allBF(),'batch');cq.batch=b.length?b[b.length-1]:'';}
  if(cq.batch&&!cq.faculty){var f=uniq(allBF().filter(function(r){return r.batch===cq.batch;}),'faculty');cq.faculty=f.length?f[0]:'';}
  var inB=allBF().filter(function(r){return r.batch===cq.batch;});
  var inBF=inB.filter(function(r){return r.faculty===cq.faculty;});
  if(!rows.length&&!Object.keys(roster).length){
    page('<div class="hero rise"><h2>স্বাগতম 👋</h2><p>এখনো কোনো হাজিরা Sync করা হয়নি। অ্যাপ থেকে হাজিরা নিয়ে <b>SYNC TO REPON</b> চাপলে এখানে দেখা যাবে।</p></div>');
    return;
  }
  var customShow=cq.period==='Custom',refShow=['Weekly','Monthly','Annual'].indexOf(cq.period)>=0;
  page('<div class="hero rise"><h2>হাজিরা রিপোর্ট</h2><p>ব্যাচ ও ফ্যাকাল্টি বেছে রিপোর্ট দেখুন। উপরের Search বক্সে ব্যাচ, সাল, রোল, নাম বা মাস লিখে সরাসরি খুঁজতেও পারেন।</p></div>'+
   '<div class="panel rise"><div class="sec">Filter</div><div class="grid">'+
   '<div class="fld"><label>Batch</label><select id="fb">'+opts(uniq(allBF(),'batch'),cq.batch,'— বাছাই —')+'</select></div>'+
   '<div class="fld"><label>Faculty</label><select id="ff">'+opts(uniq(inB,'faculty'),cq.faculty,'— বাছাই —')+'</select></div>'+
   '<div class="fld"><label>Department / Subject</label><select id="fd">'+opts(uniq(inBF,'department'),cq.department,'সব')+'</select></div>'+
   '<div class="fld"><label>Section</label><select id="fs">'+opts(uniq(inBF,'section'),cq.section,'সব')+'</select></div>'+
   '<div class="fld"><label>Period</label><select id="fp">'+['All','Weekly','Monthly','Annual','Custom'].map(function(p){return '<option value="'+p+'"'+(cq.period===p?' selected':'')+'>'+({All:'সব তারিখ',Weekly:'সাপ্তাহিক',Monthly:'মাসিক',Annual:'বার্ষিক',Custom:'কাস্টম'})[p]+'</option>';}).join('')+'</select></div>'+
   (refShow?'<div class="fld"><label>Reference তারিখ</label><input type="date" id="fr" value="'+esc(cq.ref)+'"></div>':'')+
   (customShow?'<div class="fld"><label>থেকে</label><input type="date" id="ft" value="'+esc(cq.from)+'"></div><div class="fld"><label>পর্যন্ত</label><input type="date" id="fu" value="'+esc(cq.to)+'"></div>':'')+
   '<div class="fld"><label>Collegiate সীমা (%)</label><input type="number" id="fth" min="0" max="100" value="'+TH+'"></div>'+
   '</div></div><div id="rep"></div>');
  var ids={fb:'batch',ff:'faculty',fd:'department',fs:'section',fp:'period'};
  Object.keys(ids).forEach(function(id){document.getElementById(id).onchange=function(){
    cq[ids[id]]=this.value;
    if(id==='fb'){cq.faculty='';cq.department='';cq.section='';}
    if(id==='ff'){cq.department='';cq.section='';}
    colf={};dateF={};homeView();};});
  ['fr:ref','ft:from','fu:to'].forEach(function(p){var a=p.split(':'),el=document.getElementById(a[0]);if(el)el.onchange=function(){cq[a[1]]=this.value;renderClass();};});
  document.getElementById('fth').onchange=function(){TH=Math.max(0,Math.min(100,+this.value||DEFAULT_TH));renderClass();};
  renderClass();
}

function rosterPairs(){return Object.keys(roster).map(function(k){var a=k.split('|');return{batch:a[0],faculty:a[1],roll:a[2]};});}
function allBF(){return rows.concat(rosterPairs());}
function classData(){
  var period=resolvePeriod(cq);
  var list=rows.filter(function(r){
    if(r.batch!==cq.batch||r.faculty!==cq.faculty)return false;
    if(cq.department&&r.department!==cq.department)return false;
    if(cq.section&&r.section!==cq.section)return false;
    if(period.from&&r.class_date<period.from)return false;
    if(period.to&&r.class_date>period.to)return false;return true;});
  var students={},dateSet={};
  list.forEach(function(r){var s=students[r.roll];if(!s)s=students[r.roll]={roll:r.roll,name:'',mobile:'',section:'',days:{},batch:r.batch,faculty:r.faculty};
    var i=info(r);if(i.name)s.name=i.name;if(i.mobile)s.mobile=i.mobile;s.section=r.section;s.days[r.class_date]=r.status;dateSet[r.class_date]=1;});
  if(!cq.department&&!cq.section){Object.keys(roster).forEach(function(k){var a=k.split('|');
    if(a[0]===cq.batch&&a[1]===cq.faculty&&!students[a[2]]){var m=roster[k];students[a[2]]={roll:a[2],name:m.name||'',mobile:m.mobile||'',section:'',days:{},batch:a[0],faculty:a[1]};}});}
  var dates=Object.keys(dateSet).sort();
  var arr=Object.keys(students).map(function(k){return students[k];});
  arr.forEach(function(s){var pr=0,ab=0;dates.forEach(function(d){if(s.days[d]==='Present')pr++;else if(s.days[d]==='Absent')ab++;});
    s.present=pr;s.absent=ab;s.percent=pct(pr,ab);s.status=s.percent===null?'':(s.percent>=TH?'Collegiate':'Non-Collegiate');s.mark=markOf(s.percent);});
  return{period:period,dates:dates,list:arr};
}
var COLS=[['roll','Roll',1,'n'],['name','Name',1,'t'],['mobile','Mobile',1,'t'],['section','Section',1,'s'],['present','Total Present',1,'n'],['absent','Total Absent',1,'n'],['percent','%',1,'n'],['status','Status',1,'s'],['mark','Mark /5',1,'n']];
function applyView(d){
  var out=d.list.filter(function(s){
    for(var k in colf){var v=colf[k];if(v===''||v==null)continue;
      if(['name','mobile'].indexOf(k)>=0){if(String(s[k]).toLowerCase().indexOf(String(v).toLowerCase())<0)return false;}
      else if(k==='roll'){if(String(s.roll).indexOf(v)!==0)return false;}
      else if(k==='percent'){if(s.percent===null||s.percent<+v)return false;}
      else if(k==='present'||k==='absent'){if(s[k]<+v)return false;}
      else if(k==='mark'){if(s.mark===''||s.mark<+v)return false;}
      else if(s[k]!==v)return false;}
    for(var dt in dateF){if(dateF[dt]&&s.days[dt]!==(dateF[dt]==='P'?'Present':'Absent'))return false;}
    return true;});
  var col=COLS.filter(function(c){return c[0]===sortK;})[0];
  out.sort(function(a,b){var x=a[sortK],y=b[sortK],r;
    if(col&&col[3]==='n'){x=(x===''||x==null)?-1:+x;y=(y===''||y==null)?-1:+y;r=x-y;}else r=String(x||'').localeCompare(String(y||''),undefined,{numeric:true});
    return r*sortDir||(+a.roll-+b.roll);});
  return out;
}
function renderClass(){
  var host=document.getElementById('rep');if(!host)return;
  if(!cq.batch||!cq.faculty){host.innerHTML='<div class="panel empty"><b>ব্যাচ ও ফ্যাকাল্টি বাছাই করুন</b>রিপোর্ট দেখতে উপরের Filter ব্যবহার করুন।</div>';return;}
  var d=classData();
  if(!d.list.length){host.innerHTML='<div class="panel empty"><b>কোনো তথ্য পাওয়া যায়নি</b>নির্বাচিত শর্তে কোনো হাজিরা নেই।</div>';return;}
  var col=d.list.filter(function(s){return s.status==='Collegiate';}).length,non=d.list.filter(function(s){return s.status==='Non-Collegiate';}).length;
  var shown=applyView(d);
  var depts=cq.department?cq.department:'সব';
  host.innerHTML='<div class="rise"><div class="bar no-print"><div class="l"><div class="chips" style="margin:0"><span class="tag">Batch '+esc(cq.batch)+'</span><span class="tag">'+esc(cq.faculty)+'</span><span class="tag g">'+esc(depts)+'</span><span class="tag">'+esc(d.period.label)+'</span></div></div>'+
   '<div class="r"><button class="btn sm ghost" id="clr">ফিল্টার মুছুন</button><button class="btn sm" id="bp">🖨️ Print</button><button class="btn sm green" id="bx">📗 Excel</button><button class="btn sm ghost" id="bc">📄 CSV</button></div></div>'+
   '<div class="stats"><div class="stat s1"><b>'+d.list.length+'</b><span>Total Students</span></div><div class="stat s2"><b>'+col+'</b><span>Collegiate (≥'+TH+'%)</span></div><div class="stat s3"><b>'+non+'</b><span>Non-Collegiate</span></div></div>'+
   '<div class="hint no-print" style="margin:0 0 8px">কলামের হেডারে ⇅ চাপলে Sort, ▾ চাপলে Filter। তারিখের হেডারে ক্লিক করলে সেদিন Absent/Present-ওয়ালা দেখা যাবে। যেকোনো সারিতে ক্লিক করলে ছাত্রের রিপোর্ট খুলবে।</div>'+
   '<div class="tw" id="tw"><table class="ct"><thead><tr>'+
   COLS.map(function(c){var k=c[0],on=sortK===k,fo=colf[k]!==undefined&&colf[k]!=='';
     return '<th data-k="'+k+'"><span class="cell">'+c[1]+'<span class="so'+(on?' on':'')+'" data-so="'+k+'">'+(on?(sortDir>0?'▲':'▼'):'⇅')+'</span><span class="fi'+(fo?' on':'')+'" data-fi="'+k+'">▾</span></span></th>';}).join('')+
   d.dates.map(function(dt){var f=dateF[dt];return '<th class="dt'+(f==='A'?' fa':f==='P'?' fp':'')+'" data-d="'+dt+'" title="'+fmtBn(dt)+'"><span class="v">'+fmtBn(dt).slice(0,5)+'-'+dt.slice(2,4)+'</span></th>';}).join('')+
   '</tr></thead><tbody>'+

/* ============================ global search ============================ */
function parseSearch(text){
  var toks=text.toLowerCase().split(/[\s,]+/).filter(Boolean);
  var batches=uniq(rows,'batch'),q={batch:[],year:[],month:[],roll:[],text:[]},chips=[];
  var rolls={};rows.forEach(function(r){rolls[String(r.roll)]=1;});
  toks.forEach(function(t){
    var mi=-1;MONTHS_EN.forEach(function(m,i){if(t===m||(t.length>=3&&m.indexOf(t)===0))mi=i;});
    MONTHS_BN.forEach(function(m,i){if(t===m||(t.length>=3&&m.indexOf(t)===0))mi=i;});
    if(mi>=0){q.month.push(mi);chips.push('মাস: '+MONTHS_BN[mi]);return;}
    if(/^\d+$/.test(t)){
      if(batches.indexOf(t)>=0){q.batch.push(t);chips.push('ব্যাচ: '+t);return;}
      if(rolls[t]){q.roll.push(t);chips.push('রোল: '+t);return;}
      if(t.length===4&&+t>=2000&&+t<=2100){q.year.push(t);chips.push('সাল: '+t);return;}
      q.roll.push(t);chips.push('রোল: '+t);return;}
    q.text.push(t);chips.push('"'+t+'"');});
  return{q:q,chips:chips};
}
function searchRows(q){
  return rows.filter(function(r){
    if(q.batch.length&&q.batch.indexOf(String(r.batch))<0)return false;
    if(q.roll.length&&q.roll.indexOf(String(r.roll))<0)return false;
    if(q.year.length||q.month.length){var d=parseIso(r.class_date);if(!d)return false;
      if(q.year.length&&q.year.indexOf(String(d.getFullYear()))<0)return false;
      if(q.month.length&&q.month.indexOf(d.getMonth())<0)return false;}
    var i=info(r),hay=(i.name+' '+r.faculty+' '+r.department+' '+r.section+' '+i.mobile).toLowerCase();
    for(var k=0;k<q.text.length;k++)if(hay.indexOf(q.text[k])<0)return false;
    return true;});
}

  lastSearch=text;var ps=parseSearch(text),list=searchRows(ps.q),g={};

    '<div class="bar2"><i style="width:'+(p||0)+'%;background:'+c+'"></i></div><div class="nums"><span>Present <b>'+s.pr+'</b></span><span>Absent <b>'+s.ab+'</b></span><span>হার <b>'+(p===null?'-':p+'%')+'</b></span></div></div>';}).join('')+'</div>';
  page('<div class="bar no-print"><div class="l"><h2 style="margin:0;color:var(--brand)">Search ফলাফল</h2></div><div class="r"><button class="btn sm ghost" id="back">← ফিরে যান</button>'+(arr.length?'<button class="btn sm" id="sp">🖨️ Print</button>':'')+'</div></div>'+
   '<div class="print-only"></div>'+body,text);
  document.getElementById('back').onclick=homeView;
